services:
  phoenix:
    build:
      dockerfile: ./Dockerfile
      context: .
    # Docker's default 10 s stop timeout is too short for graceful shutdown;
    # 30 s matches the grace period the shutdown path is sized for (#17597).
    stop_grace_period: 30s
    depends_on:
      - db
    ports:
      - 6006:6006
      - 4317:4317
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432
    volumes:
      - database_data:/var/lib/postgresql/data
volumes:
  database_data:
    driver: local
